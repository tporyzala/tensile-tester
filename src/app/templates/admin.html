{% extends "base.html" %}
{% block title %}Admin Settings | Tensile Tester{% endblock %}
{% block content %}
<section class="admin-stack">
  <div class="surface">
    <div class="section-heading">
      <div>
        <p class="eyebrow">Controller</p>
        <h1>Admin Settings</h1>
      </div>
      <div class="state-pill">{{ snapshot.state }}</div>
    </div>
    <form
      class="settings-grid"
      hx-post="/api/settings"
      hx-target="#settings-feedback"
      hx-swap="innerHTML"
    >
      <label><span>P gain</span><input type="number" step="0.0001" name="p_gain" value="{{ settings.p_gain }}" required></label>
      <label><span>I gain</span><input type="number" step="0.0001" name="i_gain" value="{{ settings.i_gain }}" required></label>
      <label><span>D gain</span><input type="number" step="0.0001" name="d_gain" value="{{ settings.d_gain }}" required></label>
      <label><span>Deadband N</span><input type="number" step="0.01" name="deadband_n" value="{{ settings.deadband_n }}" required></label>
      <label><span>Overload threshold N</span><input type="number" step="0.1" name="overload_threshold_n" value="{{ settings.overload_threshold_n }}" required></label>
      <label><span>Microstepping</span><input type="number" step="1" name="microstepping" value="{{ settings.microstepping }}" required></label>
      <label><span>Jog speed steps/s</span><input type="number" step="1" name="jog_speed_steps_s" value="{{ settings.jog_speed_steps_s }}" required></label>
      <label><span>Max step rate steps/s</span><input type="number" step="1" name="max_step_rate_steps_s" value="{{ settings.max_step_rate_steps_s }}" required></label>
      <label><span>Max acceleration steps/s2</span><input type="number" step="1" name="max_acceleration_steps_s2" value="{{ settings.max_acceleration_steps_s2 }}" required></label>
      <label><span>Return-to-zero rate N/s</span><input type="number" step="0.1" name="return_to_zero_rate_n_s" value="{{ settings.return_to_zero_rate_n_s }}" required></label>
      <label class="checkbox-row"><input type="checkbox" name="invert_motor_direction" {% if settings.invert_motor_direction %}checked{% endif %}><span>Invert motor direction</span></label>
      <label class="checkbox-row"><input type="checkbox" name="invert_load_cell_sign" {% if settings.invert_load_cell_sign %}checked{% endif %}><span>Invert load cell sign</span></label>
      <button type="submit" class="primary">Save Settings</button>
    </form>
    <div id="settings-feedback" class="feedback-slot"></div>
  </div>

  <div class="surface service-panel">
    <div class="section-heading compact">
      <div>
        <p class="eyebrow">Service</p>
        <h2>Setup Mode</h2>
      </div>
    </div>
    <div class="button-row">
      <button
        type="button"
        data-admin-action="/api/machine/setup/enter"
        {% if snapshot.state != "IDLE" %}disabled{% endif %}
      >
        Enter Setup
      </button>
      <button
        type="button"
        data-admin-action="/api/machine/setup/exit"
        {% if snapshot.state != "SETUP" %}disabled{% endif %}
      >
        Exit Setup
      </button>
    </div>
    <div id="admin-command-feedback" class="feedback-slot"></div>
  </div>
</section>
{% endblock %}
{% block scripts %}
<script src="/static/js/admin.js"></script>
{% endblock %}
